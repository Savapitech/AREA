services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports: ['127.0.0.1:15433:5432']
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: benchroot
      MARIADB_USER: bench
      MARIADB_PASSWORD: bench
      MARIADB_DATABASE: bench
    ports: ['127.0.0.1:13307:3306']
  mongodb:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:17017:27017']
